[project]
maintainers = [{ name = "Herman Singh", email = "kartstig@gmail.com" }]
authors = [{ name = "Herman Singh", email = "kartstig@gmail.com" }]
name = "healthy_api"
description = "Healthy-API adds a healthcheck endpoint for all web frameworks."
readme = "README.rst"
license = { text = "MIT License" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.5",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">3.7"
dependencies = []
dynamic = ["version"]

[project.optional-dependencies]
flask = ["Flask>=0.12"]
fastapi = ["fastapi"]
all = ["Flask>=0.12", "fastapi"]

[project.urls]
Donate = "https://github.com/sponsors/Kartstig/dashboard"
Documentation = "https://readthedocs.org/projects/healthy_api"
"Source Code" = "https://github.com/Kartstig/healthy_api"
"Issue Tracker" = "https://github.com/Kartstig/healthy_api/issues"


[build-system]
requires = ["setuptools>=63.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "healthy_api.__version__" }

[tool.setuptools.package-data]
healthy_api = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    # Flask <3.1 still calls pkgutil.get_loader → find_loader when resolving app root.
    "ignore:'pkgutil.get_loader' is deprecated:DeprecationWarning",
    "ignore:'pkgutil.find_loader' is deprecated:DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["healthy_api", "tests"]

[tool.coverage.paths]
source = ["src"]

[tool.ruff]
line-length = 99
target-version = "py38"
src = ["src"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["flask", "flask.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["fastapi", "fastapi.*"]
ignore_missing_imports = true
