name: HAPI

on:
  push:

# Ruff/mypy jobs use Python 3.12: installing the project pulls FastAPI → pydantic-core,
# which builds with PyO3; that stack does not support 3.14 yet (wheels/build caps).
jobs:
  ruff-format:
    name: Ruff Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: |
          uv venv --clear
          uv pip install -r requirements.txt -r requirements_dev.txt -e .
      - name: Ruff format check
        run: uv run ruff format --check src/healthy_api tests

  ruff-lint:
    name: Ruff Lint
    runs-on: ubuntu-latest
    needs: ruff-format
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: |
          uv venv --clear
          uv pip install -r requirements.txt -r requirements_dev.txt -e .
      - name: Ruff lint
        run: uv run ruff check --output-format=github src/healthy_api tests

  mypy:
    name: Mypy
    runs-on: ubuntu-latest
    needs: ruff-lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: |
          uv venv --clear
          uv pip install -r requirements.txt -r requirements_dev.txt -e .
      - name: Type check
        run: uv run mypy src/healthy_api

  pytest:
    name: Pytest (${{ matrix.tox-env }})
    runs-on: ubuntu-latest
    needs: mypy
    strategy:
      matrix:
        include:
          - python-version: "3.8"
            tox-env: "py38"
          - python-version: "3.9"
            tox-env: "py39"
          - python-version: "3.10"
            tox-env: "py310"
          - python-version: "3.11"
            tox-env: "py311"
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        run: |
          uv venv --clear
          uv pip install -r requirements.txt -r requirements_dev.txt -e .
      - name: Run tox
        run: uv run tox -e ${{ matrix.tox-env }} -vv
      - name: Upload coverage reports to Codecov
        if: matrix.tox-env == 'py311'
        uses: codecov/codecov-action@v4
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
