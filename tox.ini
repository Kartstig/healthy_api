[tox]
minversion = 4.0
envlist = py38, py39, py310, py311
skip_missing_interpreters = true
requires =
    tox >= 4.6
    virtualenv >= 20.24.0

[testenv]
description = Run the test suite (imports use src layout; see PYTHONPATH).
skip_install = true
deps =
    pytest
    Flask
    fastapi
    httpx; python_version < "3.10"
    httpx2; python_version >= "3.10"
    mock
setenv =
    PYTHONPATH = {toxinidir}
commands =
    python -m pytest {posargs:-vv}
